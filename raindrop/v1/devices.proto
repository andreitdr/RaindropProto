syntax = "proto3";

package raindrop.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "RaindropServer.Grpc.Protocol";

// End-to-end encryption's identity layer: devices, session binding, key backup and device linking.
// The server holds public keys and opaque blobs only; every bytes field here is produced and checked
// by the clients' Rust core (see RaindropCrypto/docs/wire-contracts.md).
service DeviceService {
  // Register a device from its certificate. The first one sets the user's identity key.
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);

  // Identity keys and active devices of up to 500 users.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);

  // Revoke one of your devices: needs a bound session, unless it is this one.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);

  // With the password: forget the identity key and backup, and revoke every device.
  rpc ResetIdentity(ResetIdentityRequest) returns (ResetIdentityResponse);

  // A one-time nonce for a device key to sign.
  rpc CreateSessionChallenge(CreateSessionChallengeRequest) returns (CreateSessionChallengeResponse);

  // Bind this session to a device with that signature.
  rpc BindSession(BindSessionRequest) returns (BindSessionResponse);

  // The sealed key backup.
  rpc GetKeyBackup(GetKeyBackupRequest) returns (GetKeyBackupResponse);

  // Replace the backup: needs a bound session.
  rpc PutKeyBackup(PutKeyBackupRequest) returns (PutKeyBackupResponse);

  // A new device posts its link offer and gets the id its link code shows.
  rpc StartDeviceLink(StartDeviceLinkRequest) returns (StartDeviceLinkResponse);

  // An existing device fetches the offer, to check it against the link code.
  rpc GetDeviceLinkOffer(GetDeviceLinkOfferRequest) returns (GetDeviceLinkOfferResponse);

  // An existing device posts its encrypted approval: needs a bound session.
  rpc ApproveDeviceLink(ApproveDeviceLinkRequest) returns (ApproveDeviceLinkResponse);

  // The new device collects the approval once it is there.
  rpc TakeDeviceLinkApproval(TakeDeviceLinkApprovalRequest) returns (TakeDeviceLinkApprovalResponse);

  // Replace the caller's identity vault and sealed root: needs a bound session.
  rpc PutIdentityVault(PutIdentityVaultRequest) returns (PutIdentityVaultResponse);

  // The caller's identity vault and sealed root: needs a bound session.
  rpc GetIdentityVault(GetIdentityVaultRequest) returns (GetIdentityVaultResponse);

  // The sealed root stored under a recovery lookup id, for a device that has only the recovery
  // words. Anonymous.
  rpc GetSealedRoot(GetSealedRootRequest) returns (GetSealedRootResponse);

  // Set or replace the account's authenticator: needs a bound session, so any device still paired
  // can replace a lost one.
  rpc EnrollAuthenticator(EnrollAuthenticatorRequest) returns (EnrollAuthenticatorResponse);

  // Remove the account's authenticator: needs a bound session.
  rpc DisableAuthenticator(DisableAuthenticatorRequest) returns (DisableAuthenticatorResponse);

  // Whether the account has an authenticator, and how many backup codes are left.
  rpc GetAuthenticatorStatus(GetAuthenticatorStatusRequest) returns (GetAuthenticatorStatusResponse);

  // The waits to add a device without an authenticator code (UserService.RequestRecovery) running on
  // the account: needs a bound session.
  rpc GetRecoveryStatus(GetRecoveryStatusRequest) returns (GetRecoveryStatusResponse);

  // Cancels every one of them, for good: needs a bound session.
  rpc CancelRecovery(CancelRecoveryRequest) returns (CancelRecoveryResponse);

  // A device with no account anywhere posts its pairing offer. Anonymous.
  rpc StartPairing(StartPairingRequest) returns (StartPairingResponse);

  // A paired device fetches the offer, to check it against the pairing code: needs a bound session.
  rpc GetPairingOffer(GetPairingOfferRequest) returns (GetPairingOfferResponse);

  // A paired device posts its sealed approval: needs a bound session.
  rpc ApprovePairing(ApprovePairingRequest) returns (ApprovePairingResponse);

  // The new device collects the approval, once. Anonymous; needs the token StartPairing returned.
  rpc TakePairingApproval(TakePairingApprovalRequest) returns (TakePairingApprovalResponse);
}

// One device.
message Device {
  string device_id = 1;
  // Exactly as uploaded; clients verify it themselves.
  bytes certificate = 2;
  google.protobuf.Timestamp created_at = 3;
}

// One user's identity key and active devices.
message UserDevices {
  string user_id = 1;
  // Absent before their first device is registered.
  optional bytes identity_key = 2;
  // Oldest first.
  repeated Device devices = 3;
}

// Registers a device.
message RegisterDeviceRequest {
  // The device certificate, signed by the user's identity key.
  bytes certificate = 1;
}

// The registered device.
message RegisterDeviceResponse {
  Device device = 1;
}

// Asks for users' identity keys and devices.
message ListDevicesRequest {
  // At most 500.
  repeated string user_ids = 1;
}

// One entry per user asked about.
message ListDevicesResponse {
  repeated UserDevices users = 1;
}

// Revokes a device.
message RevokeDeviceRequest {
  string device_id = 1;
}

// A human-readable confirmation.
message RevokeDeviceResponse {
  string message = 1;
}

// Resets the user's identity.
message ResetIdentityRequest {
  string password = 1;
}

// A human-readable confirmation.
message ResetIdentityResponse {
  string message = 1;
}

// Asks for a binding challenge.
message CreateSessionChallengeRequest {}

// The challenge to sign.
message CreateSessionChallengeResponse {
  // 32 random bytes, usable once.
  bytes nonce = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Binds the session to a device.
message BindSessionRequest {
  string device_id = 1;
  // Ed25519 over "raindrop/session-binding/v1\n" ‖ nonce, by the device's signature key.
  bytes signature = 2;
}

// A human-readable confirmation.
message BindSessionResponse {
  string message = 1;
}

// Asks for the key backup.
message GetKeyBackupRequest {}

// The backup, if there is one.
message GetKeyBackupResponse {
  optional bytes blob = 1;
  optional google.protobuf.Timestamp updated_at = 2;
}

// Replaces the key backup.
message PutKeyBackupRequest {
  // The sealed backup, at most 64 KiB.
  bytes blob = 1;
}

// The backup as stored.
message PutKeyBackupResponse {
  optional bytes blob = 1;
  optional google.protobuf.Timestamp updated_at = 2;
}

// Starts a device link.
message StartDeviceLinkRequest {
  // The new device's offer: opaque, at most 4 KiB.
  bytes offer = 1;
}

// The link to show in the link code.
message StartDeviceLinkResponse {
  string link_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Fetches a link's offer.
message GetDeviceLinkOfferRequest {
  string link_id = 1;
}

// The offer, for checking against the link code's commitment.
message GetDeviceLinkOfferResponse {
  bytes offer = 1;
}

// Approves a link.
message ApproveDeviceLinkRequest {
  string link_id = 1;
  // Encrypted to the new device; at most 8 KiB.
  bytes approval = 2;
}

// A human-readable confirmation.
message ApproveDeviceLinkResponse {
  string message = 1;
}

// Collects a link's approval.
message TakeDeviceLinkApprovalRequest {
  string link_id = 1;
}

// The approval, once an existing device has given it.
message TakeDeviceLinkApprovalResponse {
  optional bytes approval = 1;
}

// Replaces the identity vault.
message PutIdentityVaultRequest {
  // 32 lower-case hex characters, derived from the recovery key and this server's identity key.
  string lookup_id = 1;
  // The root secret sealed under the recovery key. Opaque.
  bytes sealed_root = 2;
  // The vault, sealed under the root. Opaque.
  bytes vault = 3;
}

// When it was stored.
message PutIdentityVaultResponse {
  google.protobuf.Timestamp updated_at = 1;
}

// Asks for the caller's identity vault.
message GetIdentityVaultRequest {}

// The vault, if there is one.
message GetIdentityVaultResponse {
  optional string lookup_id = 1;
  optional bytes sealed_root = 2;
  optional bytes vault = 3;
  optional google.protobuf.Timestamp updated_at = 4;
}

// Asks for a sealed root by its lookup id.
message GetSealedRootRequest {
  string lookup_id = 1;
}

// The sealed root, and the vault sealed under it.
message GetSealedRootResponse {
  bytes sealed_root = 1;
  // The vault (its server list above all), sealed under the root: it opens only once the sealed root
  // has. Lets a device recovering with the words reach every server at once, before signing in.
  bytes vault = 2;
}

// Sets the account's authenticator.
message EnrollAuthenticatorRequest {
  // The TOTP secret (RFC 6238: SHA-1, 30 seconds, 6 digits), 20 to 64 bytes.
  bytes secret = 1;
  // A current code from that secret, proving the authenticator app holds it.
  string code = 2;
  // One-time backup codes, at most 10, each 8 to 32 characters. Stored hashed.
  repeated string backup_codes = 3;
}

// A human-readable confirmation.
message EnrollAuthenticatorResponse {
  string message = 1;
}

// Removes the account's authenticator.
message DisableAuthenticatorRequest {}

// A human-readable confirmation.
message DisableAuthenticatorResponse {
  string message = 1;
}

// Asks about the account's authenticator.
message GetAuthenticatorStatusRequest {}

// Whether there is one.
message GetAuthenticatorStatusResponse {
  bool enabled = 1;
  int32 backup_codes_left = 2;
}

// A device waiting to be added to the account without an authenticator code.
message PendingRecovery {
  string device_id = 1;
  google.protobuf.Timestamp requested_at = 2;
  // When it gets in, unless cancelled before then.
  google.protobuf.Timestamp eligible_at = 3;
}

// Asks for the running recovery waits.
message GetRecoveryStatusRequest {}

// The running waits, oldest first; empty when there are none.
message GetRecoveryStatusResponse {
  repeated PendingRecovery recoveries = 1;
}

// Cancels every running recovery wait.
message CancelRecoveryRequest {}

// How many were running.
message CancelRecoveryResponse {
  int32 cancelled = 1;
}

// Starts a pairing.
message StartPairingRequest {
  // The new device's pairing offer: opaque, at most 1 KiB.
  bytes offer = 1;
}

// The pairing to show in the pairing code.
message StartPairingResponse {
  string pairing_id = 1;
  // Kept by the new device and sent back to collect the approval.
  string take_token = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// Fetches a pairing's offer.
message GetPairingOfferRequest {
  string pairing_id = 1;
}

// The offer, for checking against the pairing code's commitment.
message GetPairingOfferResponse {
  bytes offer = 1;
}

// Approves a pairing.
message ApprovePairingRequest {
  string pairing_id = 1;
  // Sealed to the new device; at most 512 KiB.
  bytes approval = 2;
}

// A human-readable confirmation.
message ApprovePairingResponse {
  string message = 1;
}

// Collects a pairing's approval.
message TakePairingApprovalRequest {
  string pairing_id = 1;
  string take_token = 2;
}

// The approval, once a paired device has given it.
message TakePairingApprovalResponse {
  optional bytes approval = 1;
}
