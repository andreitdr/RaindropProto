syntax = "proto3";

package raindrop.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "RaindropServer.Grpc.Protocol";

// Voice calls. Raindrop decides who may join, speak, show their camera, share their screen and moderate;
// the media itself goes over the media transport a join names (LiveKit today: WebRTC, its signalling
// relayed by this server as a WebSocket, end-to-end encrypted with a key from the channel's MLS group —
// one key for a call, covering voice, camera and screen alike). This service is the control half only.
service VoiceService {
  // Whether voice works here, and who is in every call the caller can see.
  rpc GetVoiceStatus(GetVoiceStatusRequest) returns (GetVoiceStatusResponse);

  // Join a call: needs connect. Returns where to connect and a short-lived token.
  rpc JoinVoice(JoinVoiceRequest) returns (JoinVoiceResponse);

  // Leave the named call. Idempotent; only the session that joined can leave.
  rpc LeaveVoice(LeaveVoiceRequest) returns (LeaveVoiceResponse);

  // Self mute, deafen, camera and screen share. Mute and deafen are only everybody's icons; turning the
  // camera on or starting a screen share is also what earns the media transport's permission to send
  // it, so either can be refused. The camera needs video, and refuses with camera_limit_reached when
  // every camera place in the call is taken; a screen share needs screen_share, and refuses with
  // screen_share_limit_reached when every sharing place is taken.
  rpc SetVoiceSelfState(SetVoiceSelfStateRequest) returns (SetVoiceSelfStateResponse);

  // Mute or unmute a member for everyone: needs mute_members server-wide.
  rpc MuteVoiceMember(MuteVoiceMemberRequest) returns (MuteVoiceMemberResponse);
}

// One member in one call, the whole state: merge on (channel_id, user_id).
message VoiceParticipant {
  string channel_id = 1;
  string user_id = 2;
  bool self_mute = 3;
  // Implies self_mute.
  bool self_deaf = 4;
  // A moderator muted them for everyone.
  bool server_mute = 5;
  // They may listen but not talk: they lack speak.
  bool suppressed = 6;
  // The media server has seen them connect.
  bool connected = 7;
  google.protobuf.Timestamp joined_at = 8;
  // They are sending their camera to the call.
  bool camera_on = 9;
  // They may listen and talk but not turn their camera on: they lack video, or every camera place in
  // this call is taken.
  bool camera_suppressed = 10;
  // They are sharing a screen or a window with the call.
  bool screen_share_on = 11;
  // What they are sharing. UNSPECIFIED while screen_share_on is false.
  ScreenShareKind screen_share_kind = 12;
  // They are sending the shared window's own sound with it. Only ever with a window, and only while
  // they may speak: a member muted for everyone sends no sound into the call, whatever its source.
  bool screen_share_audio = 13;
  // They may not start a screen share: they lack screen_share, or every sharing place in this call is
  // taken.
  bool screen_share_suppressed = 14;
}

// What a screen share shows. A closed set: there is nothing else a share can be.
enum ScreenShareKind {
  SCREEN_SHARE_KIND_UNSPECIFIED = 0;
  // A whole display. Never carries sound: the host's sound is never sent.
  SCREEN_SHARE_KIND_SCREEN = 1;
  // One window, optionally with that window's own sound.
  SCREEN_SHARE_KIND_WINDOW = 2;
}

// Asks for voice status.
message GetVoiceStatusRequest {}

// Whether voice works, and every visible call.
message GetVoiceStatusResponse {
  // False when the server has no media server; joining is refused with voice_unavailable.
  bool available = 1;
  // e.g. "livekit"; "none" when unavailable.
  string transport = 2;
  int32 maximum_participants = 3;
  // By channel, then join time.
  repeated VoiceParticipant participants = 4;
  // How many members of one call may send their camera at once. 0 when this server carries no camera
  // video, which is also when it does not advertise voice.video.v1.
  int32 maximum_camera_publishers = 5;
  // How many members of one call may share their screen at once. 0 when this server carries no screen
  // sharing, which is also when it does not advertise voice.screen.v1.
  int32 maximum_screen_shares = 6;
  // The most lines a shared screen may be sent at on this server: 480, 720 or 1080. 0 when the server
  // states none (an older one), which a client reads as 1080. A client fits its share inside the box
  // this names. Honoured by clients rather than enforced: the media is end-to-end encrypted and this
  // server never sees a frame of it.
  int32 maximum_screen_share_height = 7;
  // The most frames a second a shared screen may be sent at on this server: 15, 24, 30 or 60. 0 when
  // the server states none, which a client reads as 60. Honoured by clients, like the height.
  int32 maximum_screen_share_frame_rate = 8;
}

// Joins a call.
message JoinVoiceRequest {
  string channel_id = 1;
  // Join already muted, so nobody sees you unmuted for a moment.
  bool self_mute = 2;
  bool self_deaf = 3;
}

// What a client needs to connect to the call it was just admitted to.
message JoinVoiceResponse {
  string channel_id = 1;
  // Which media transport to connect with. A client that does not know it cannot join.
  string transport = 2;
  // An absolute address, or absent to connect through this server at path.
  optional string url = 3;
  optional string path = 4;
  // The transport's short-lived credential; join again for a fresh one.
  string token = 5;
  google.protobuf.Timestamp expires_at = 6;
  VoiceParticipant you = 7;
  // Everybody in the call, you included, by join time.
  repeated VoiceParticipant participants = 8;
}

// Leaves a call, named so a late leave cannot end a call another device has since joined.
message LeaveVoiceRequest {
  string channel_id = 1;
}

// left is false when you were not in that call — not an error.
message LeaveVoiceResponse {
  bool left = 1;
}

// Sets your own mute, deafen, camera and screen share. This is the whole state, not a change: every
// field is read, so a client must send the share it already has or it ends it.
message SetVoiceSelfStateRequest {
  bool self_mute = 1;
  bool self_deaf = 2;
  // Turn the camera on or off. A client too old to send this reads as off, which is what it was.
  // Joining never starts the camera, so this is the only way it goes on.
  bool camera_on = 3;
  // Start or stop sharing. A client too old to send this reads as not sharing, which is what it was.
  bool screen_share_on = 4;
  // Required while screen_share_on; refused with invalid_payload when UNSPECIFIED.
  ScreenShareKind screen_share_kind = 5;
  // Send the shared window's own sound too. Only with SCREEN_SHARE_KIND_WINDOW, and refused with
  // invalid_payload on a screen: the host's sound is never sent. Granted only while you may speak.
  bool screen_share_audio = 6;
}

// Your state in the call now.
message SetVoiceSelfStateResponse {
  VoiceParticipant participant = 1;
}

// Mutes or unmutes a member for everyone.
message MuteVoiceMemberRequest {
  string user_id = 1;
  bool muted = 2;
}

// changed is false when they already were (or already were not).
message MuteVoiceMemberResponse {
  string user_id = 1;
  bool muted = 2;
  bool changed = 3;
}
